<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
}

html{
  direction:ltr;
  scroll-behavior:smooth;
}

body{
  direction:ltr;
  background:linear-gradient(180deg,#f4f8fd 0%,#eef4fa 100%);
  color:#172033;
  line-height:1.6;
  text-align:left;
}

/* HEADER */

header{
  direction:ltr;
  background:linear-gradient(135deg,#0b3d91,#1565c0,#2196f3);
  color:white;
  text-align:center;
  padding:30px 18px 32px;
  box-shadow:0 8px 30px rgba(13,71,161,.18);
}

.logo{
  width:82px;
  height:82px;
  margin:0 auto 12px;
  border-radius:24px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.22);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

header h1{
  direction:ltr;
  unicode-bidi:isolate;
  font-size:29px;
  font-weight:800;
  letter-spacing:.2px;
}

header p{
  direction:ltr;
  unicode-bidi:isolate;
  margin-top:4px;
  font-size:14px;
  opacity:.9;
}

/* MAIN */

.container{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:28px 16px 40px;
  direction:ltr;
}

/* SECTION TITLE */

.section-title{
  direction:ltr;
  text-align:center;
  margin-bottom:22px;
}

.section-title h2{
  direction:ltr;
  unicode-bidi:isolate;
  color:#123d73;
  font-size:25px;
  font-weight:800;
  margin-bottom:2px;
}

.section-title p{
  direction:rtl;
  unicode-bidi:isolate;
  color:#718096;
  font-size:14px;
}

/* SERVICES */

.services{
  direction:ltr !important;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  width:100%;
}

.service{
  direction:ltr !important;
  unicode-bidi:isolate;
  min-height:155px;
  padding:22px 12px;
  background:linear-gradient(145deg,#ffffff,#f8fbff);
  border:1px solid #e1eaf5;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center !important;
  cursor:pointer;
  box-shadow:0 7px 22px rgba(13,71,161,.07);
  transition:transform .25s ease,
             box-shadow .25s ease,
             border-color .25s ease;
}

.service:hover{
  transform:translateY(-5px);
  border-color:#b8d5f5;
  box-shadow:0 14px 32px rgba(13,71,161,.14);
}

.service:active{
  transform:scale(.97);
}

.service .icon{
  width:58px;
  height:58px;
  border-radius:17px;
  background:#edf5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  margin-bottom:11px;
  box-shadow:inset 0 0 0 1px rgba(21,101,192,.05);
}

.service h3{
  direction:ltr !important;
  unicode-bidi:isolate;
  text-align:center !important;
  color:#1e3552;
  font-size:16px;
  line-height:1.4;
  font-weight:800;
}

.service h3 span{
  direction:rtl;
  unicode-bidi:isolate;
  display:block;
  color:#718096;
  font-size:13px;
  line-height:1.7;
  font-weight:500;
  margin-top:2px;
}

/* FORMS */

.form{
  direction:ltr !important;
  display:none;
  width:100%;
  margin-top:25px;
  padding:23px;
  background:#ffffff;
  border:1px solid #e1e8f0;
  border-radius:22px;
  box-shadow:0 10px 32px rgba(20,45,80,.09);
  animation:formIn .3s ease;
}

@keyframes formIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* FORM HEADING — FORCE LTR */

.form h2{
  direction:ltr !important;
  unicode-bidi:isolate !important;
  text-align:left !important;
  color:#1565c0;
  font-size:21px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:9px;
}

/* FORM DESCRIPTION */

.note{
  direction:rtl;
  unicode-bidi:isolate;
  text-align:right;
  color:#687386;
  line-height:1.9;
  margin-bottom:21px;
  font-size:14px;
}

/* LABELS */

label{
  direction:ltr !important;
  unicode-bidi:isolate;
  display:block;
  text-align:left !important;
  font-weight:700;
  margin-bottom:7px;
  color:#26364d;
  font-size:14px;
}

/* INPUTS */

input,
textarea,
select{
  direction:ltr !important;
  unicode-bidi:isolate;
  width:100%;
  padding:14px;
  border:1px solid #d9e2ec;
  border-radius:12px;
  font-size:15px;
  margin-bottom:16px;
  outline:none;
  background:#fff;
  color:#222;
  transition:border-color .2s ease,
             box-shadow .2s ease;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#1976d2;
  box-shadow:0 0 0 4px rgba(25,118,210,.10);
}

textarea{
  min-height:125px;
  resize:vertical;
}

/* PLACEHOLDER */

input::placeholder,
textarea::placeholder{
  direction:auto;
  color:#9aa5b3;
}

/* BUTTONS */

.buttons{
  direction:ltr;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 10px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:transform .2s ease,
             box-shadow .2s ease,
             opacity .2s ease;
}

button:hover{
  transform:translateY(-2px);
}

button:active{
  transform:scale(.98);
}

.whatsapp{
  background:linear-gradient(135deg,#20c964,#25D366);
  color:white;
  box-shadow:0 5px 15px rgba(37,211,102,.20);
}

.call{
  background:linear-gradient(135deg,#0d47a1,#1976d2);
  color:white;
  box-shadow:0 5px 15px rgba(21,101,192,.18);
}

.close{
  direction:ltr;
  width:100%;
  margin-top:11px;
  background:#eef2f6;
  color:#303844;
}

.chat{
  direction:ltr;
  width:100%;
  margin-top:26px;
  background:linear-gradient(135deg,#20c964,#25D366);
  color:white;
  padding:16px;
  font-size:15px;
  border-radius:14px;
  box-shadow:0 7px 20px rgba(37,211,102,.20);
}

/* FOOTER */

.footer{
  direction:ltr;
  text-align:center;
  color:#7a8493;
  font-size:13px;
  padding:28px 10px 5px;
}

.footer strong{
  direction:ltr;
  color:#1565c0;
  font-size:14px;
}

/* DESKTOP */

@media(min-width:600px){

  .services{
    grid-template-columns:repeat(4,1fr);
  }

  .container{
    padding-top:35px;
  }

  .service{
    min-height:160px;
  }

}

/* SMALL MOBILE */

@media(max-width:380px){

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .services{
    gap:11px;
  }

  .service{
    min-height:140px;
    padding:17px 8px;
  }

  .service .icon{
    width:52px;
    height:52px;
    font-size:28px;
  }

  .service h3{
    font-size:14px;
  }

  .service h3 span{
    font-size:12px;
  }

  .form{
    padding:18px;
  }

  .form h2{
    font-size:19px;
  }

}

</style>
